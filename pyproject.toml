[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "altryx-accelerator"
version = "1.0.0"
description = "Alteryx .yxmd → Databricks PySpark notebook converter with a self-correcting validation loop, packaged as a Databricks Asset Bundle"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Aviral Bhardwaj" }]
keywords = ["alteryx", "databricks", "pyspark", "migration", "delta-lake", "unity-catalog"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "lxml>=4.9",
    "pyyaml>=6.0",
    "nbformat>=5.9",
]

[project.optional-dependencies]
ai = ["anthropic>=0.39.0", "jinja2>=3.0"]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
spark = ["pyspark>=3.4"]

[project.urls]
Repository = "https://github.com/aviral-bhardwaj/Altryx-Accelerator"

[project.scripts]
altryx-convert = "convert:main"

[tool.setuptools]
packages = ["src", "src.tools"]
py-modules = ["convert"]

[tool.pytest.ini_options]
testpaths = ["tests"]
