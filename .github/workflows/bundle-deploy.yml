name: Bundle Validate & Deploy

# CI/CD for the Databricks Asset Bundle:
#   - every push / PR: unit tests + `databricks bundle validate`
#   - push to main:    deploy to the dev target (and staging when configured)
#
# Required repository secrets:
#   DATABRICKS_HOST   e.g. https://adb-1234567890123456.7.azuredatabricks.net
#   DATABRICKS_TOKEN  PAT or service-principal OAuth token

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: "Bundle target to deploy"
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests/ -q --tb=short

      - name: End-to-end sample conversion
        run: |
          python convert.py tests/sample_workflows/02_join_summarize.yxmd \
            --self-correct --format ipynb,py --output-dir ./ci_output
          test -f ci_output/02_join_summarize.ipynb

  validate:
    name: Bundle validate
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: databricks bundle validate
        run: databricks bundle validate -t dev
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}

  deploy:
    name: Deploy bundle
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    concurrency: bundle-deploy-${{ github.event.inputs.target || 'dev' }}
    environment: ${{ github.event.inputs.target || 'dev' }}
    steps:
      - uses: actions/checkout@v4

      - uses: databricks/setup-cli@main

      - name: databricks bundle deploy
        run: |
          TARGET="${{ github.event.inputs.target || 'dev' }}"
          databricks bundle validate -t "$TARGET"
          databricks bundle deploy  -t "$TARGET"
        env:
          DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
          DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
