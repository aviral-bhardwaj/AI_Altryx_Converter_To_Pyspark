name: Bundle Validate & Deploy

# CI/CD for the Databricks Asset Bundle:
#   - every push / PR: unit tests + `databricks bundle validate`
#   - push to main:    deploy to the dev target (and staging when configured)
#
# Required repository secrets:
#   DATABRICKS_HOST   e.g. https://adb-1234567890123456.7.azuredatabricks.net
#   DATABRICKS_TOKEN  PAT or service-principal OAuth token

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      target:
        description: "Bundle target to deploy"
        required: true
        default: dev
        type: choice
        options: [dev, staging, prod]

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run test suite
        run: pytest tests/ -q --tb=short

      - name: End-to-end sample conversion
        run: |
          python convert.py tests/sample_workflows/02_join_summarize.yxmd \
            --self-correct --format ipynb,py --output-dir ./ci_output
          test -f ci_output/02_join_summarize.ipynb

  validate:
    name: Bundle validate
    runs-on: ubuntu-latest
    needs: test
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: databricks/setup-cli@main

      # `bundle validate` authenticates against the workspace (it resolves the
      # current user for dev-mode paths), so it can only run once the
      # DATABRICKS_HOST / DATABRICKS_TOKEN repository secrets are configured.
      - name: databricks bundle validate
        if: env.DATABRICKS_HOST != ''
        run: databricks bundle validate -t dev

      - name: Offline bundle checks (no workspace secrets configured)
        if: env.DATABRICKS_HOST == ''
        run: |
          echo "::notice::DATABRICKS_HOST/DATABRICKS_TOKEN secrets not set — running offline checks only."
          echo "::notice::Add the secrets in Settings → Secrets and variables → Actions to enable full 'databricks bundle validate'."
          python - <<'EOF'
          import sys, yaml
          for f in ("databricks.yml", "resources/alteryx_migration_job.yml", "config/tool_mapping.yaml"):
              data = yaml.safe_load(open(f))
              assert data, f"{f} is empty"
              print(f"OK  {f}")
          bundle = yaml.safe_load(open("databricks.yml"))
          assert bundle["bundle"]["name"] == "alteryx-to-databricks-converter"
          assert set(bundle["targets"]) >= {"dev", "staging", "prod"}, "missing bundle targets"
          job = yaml.safe_load(open("resources/alteryx_migration_job.yml"))
          assert "alteryx_migration_job" in job["resources"]["jobs"]
          print("Offline bundle structure checks passed.")
          EOF

  deploy:
    name: Deploy bundle
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref == 'refs/heads/main')
    concurrency: bundle-deploy-${{ github.event.inputs.target || 'dev' }}
    environment: ${{ github.event.inputs.target || 'dev' }}
    env:
      DATABRICKS_HOST: ${{ secrets.DATABRICKS_HOST }}
      DATABRICKS_TOKEN: ${{ secrets.DATABRICKS_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: databricks/setup-cli@main

      - name: databricks bundle deploy
        if: env.DATABRICKS_HOST != ''
        env:
          TARGET_INPUT: ${{ github.event.inputs.target || 'dev' }}
        run: |
          TARGET="$TARGET_INPUT"
          databricks bundle validate -t "$TARGET"
          databricks bundle deploy  -t "$TARGET"

      - name: Deploy skipped (no workspace secrets configured)
        if: env.DATABRICKS_HOST == ''
        run: echo "::notice::Deploy skipped — set DATABRICKS_HOST/DATABRICKS_TOKEN secrets to enable bundle deployment."
